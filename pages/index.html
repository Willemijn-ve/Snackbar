<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area42 Restaurant</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <main class="welcome-screen">

        <div class="welcome-card">

            <img src="../images/logonobackground.png" alt="Area42 Logo" class="logo">

            <h1>Welcome</h1>

            <p>
                Enjoy delicious food, refreshing drinks and a relaxing atmosphere
                in the heart of nature.
            </p>

            <p>
                Tap the button below to start your order and discover everything
                our restaurant has to offer.
            </p>

            <button id="startButton" class="start-button">
                Start Ordering
            </button>

        </div>

    </main>

    <script src="../JS/script.js"></script>

</body>

</html>
